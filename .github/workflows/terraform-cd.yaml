name: Terraform CD

# =============================================================================
# CD Pipeline: plan → OPA gate → apply (hoặc destroy)
# Dùng OIDC thay vì static AWS keys — không cần rotate secret.
#
# Trigger:
#   - Push lên main (tự động plan + apply)
#   - workflow_dispatch (plan / apply / destroy thủ công)
#
# GitHub Secrets cần thiết:
#   AWS_DEV_ROLE_ARN     — IAM Role ARN cho OIDC (dev account)
#   BUCKET_TF_STATE      — S3 bucket name cho remote state
#   TF_VAR_db_password   — RDS master password
#   SLACK_WEBHOOK_URL
# =============================================================================

on:
  push:
    branches:
      - main
    paths:
      - "platform/infrastructure/terraform/environments/dev/**"
      - "platform/infrastructure/terraform/modules/**"
      - ".github/workflows/terraform-cd.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "Hành động Terraform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

env:
  TF_VERSION: "1.10.0"
  TF_WORKING_DIR: "platform/infrastructure/terraform/environments/dev"
  AWS_REGION: "ap-southeast-1"

# Chỉ chạy 1 workflow CD tại một thời điểm — tránh concurrent apply
concurrency:
  group: terraform-cd-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

# =============================================================================
# JOB 1: Terraform Plan
# =============================================================================
jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: dev-plan   # GitHub Environment với required reviewers nếu cần
    permissions:
      contents: read
      id-token: write       # Bắt buộc cho OIDC
      pull-requests: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: terraform-cd-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false \
            -no-color

      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -out=tfplan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            2>&1 | tee ${{ runner.temp }}/tf-plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_gitops_repo_url: ${{ secrets.GITOPS_REPO_URL }}
        continue-on-error: true

      - name: Export plan to JSON (for OPA)
        run: |
          terraform show -json tfplan > ${{ runner.temp }}/tf-plan.json
          # Validate JSON
          jq -e . ${{ runner.temp }}/tf-plan.json > /dev/null
          echo "Plan JSON exported successfully."

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tf-plan.json
            ${{ runner.temp }}/tf-plan.txt
          retention-days: 3

      - name: Fail if plan errored (exitcode=1)
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "Terraform plan failed (exit code 1). Check logs above."
          exit 1

      - name: Comment PR — Plan Output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const plan = fs.readFileSync('${{ runner.temp }}/tf-plan.txt', 'utf8');
            const max  = 60000;
            const body = plan.length > max
              ? plan.substring(0, max) + '\n\n_...truncated — see workflow logs_'
              : plan;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan [DEV]\n\n\`\`\`hcl\n${body}\n\`\`\``
            });

# =============================================================================
# JOB 2: OPA Gate — block apply nếu có deny violations
# =============================================================================
  opa-gate:
    name: OPA Policy Gate
    runs-on: ubuntu-latest
    needs: plan
    # Chỉ chạy OPA gate nếu plan có changes (exitcode=2) hoặc exitcode=0
    if: needs.plan.outputs.plan_exitcode != '1'

    steps:
      - name: Checkout code (để lấy policies/)
        uses: actions/checkout@v4

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan

      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Run OPA — security.rego deny
        id: security_deny
        run: |
          RESULT=$(opa eval \
            --format json \
            --data platform/infrastructure/terraform/policies/security.rego \
            --input ${{ runner.temp }}/plan/tf-plan.json \
            "data.terraform.security.deny")
          COUNT=$(echo "$RESULT" | jq '.result[0].expressions[0].value | length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "--- Security DENY violations ---"
          echo "$RESULT" | jq -r '.result[0].expressions[0].value[]' | sed 's/^/  /'

      - name: Run OPA — networking.rego deny
        id: networking_deny
        run: |
          RESULT=$(opa eval \
            --format json \
            --data platform/infrastructure/terraform/policies/networking.rego \
            --input ${{ runner.temp }}/plan/tf-plan.json \
            "data.terraform.networking.deny")
          COUNT=$(echo "$RESULT" | jq '.result[0].expressions[0].value | length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "--- Networking DENY violations ---"
          echo "$RESULT" | jq -r '.result[0].expressions[0].value[]' | sed 's/^/  /'

      - name: Run OPA — compliance.rego deny
        id: compliance_deny
        run: |
          RESULT=$(opa eval \
            --format json \
            --data platform/infrastructure/terraform/policies/compliance.rego \
            --input ${{ runner.temp }}/plan/tf-plan.json \
            "data.terraform.compliance.deny")
          COUNT=$(echo "$RESULT" | jq '.result[0].expressions[0].value | length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "--- Compliance DENY violations ---"
          echo "$RESULT" | jq -r '.result[0].expressions[0].value[]' | sed 's/^/  /'

      - name: Run OPA — warnings (non-blocking)
        run: |
          echo "=== WARNINGS (non-blocking) ==="
          for policy in security networking compliance; do
            opa eval \
              --format json \
              --data platform/infrastructure/terraform/policies/${policy}.rego \
              --input ${{ runner.temp }}/plan/tf-plan.json \
              "data.terraform.${policy}.warn" 2>/dev/null \
            | jq -r '.result[0].expressions[0].value[]' \
            | sed "s/^/  [WARN][$policy] /" || true
          done

      - name: Fail if any DENY violations
        run: |
          SEC="${{ steps.security_deny.outputs.count }}"
          NET="${{ steps.networking_deny.outputs.count }}"
          CMP="${{ steps.compliance_deny.outputs.count }}"
          TOTAL=$(( ${SEC:-0} + ${NET:-0} + ${CMP:-0} ))
          echo "OPA deny violations — security: $SEC, networking: $NET, compliance: $CMP, total: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo "❌ OPA gate FAILED: $TOTAL deny violation(s) found. Fix before applying."
            exit 1
          fi
          echo "✅ OPA gate PASSED: no deny violations."

# =============================================================================
# JOB 3: Terraform Apply
# =============================================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [plan, opa-gate]
    # Apply chỉ chạy:
    #   - Auto: push to main khi có changes (exitcode=2)
    #   - Manual: workflow_dispatch với action=apply
    if: |
      needs.opa-gate.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.plan_exitcode == '2') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
      )
    environment: dev-apply   # GitHub Environment — thêm required reviewers ở đây cho prod
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: terraform-cd-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false \
            -no-color

      - name: Terraform apply
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -no-color
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_gitops_repo_url: ${{ secrets.GITOPS_REPO_URL }}

      - name: Collect outputs
        if: success()
        run: |
          terraform output -json > ${{ runner.temp }}/tf-outputs.json
          echo "=== Terraform Outputs ==="
          cat ${{ runner.temp }}/tf-outputs.json | jq 'to_entries[] | "\(.key): \(.value.value)"' -r

      - name: Notify Slack — Apply Result
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Terraform Apply — DEV ${{ job.status == 'success' && '✅' || '❌' }}"
          SLACK_MESSAGE: |
            Actor  : ${{ github.actor }}
            Commit : ${{ github.sha }}
            Status : ${{ job.status }}
            Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_FOOTER: "EKS DevSecOps Platform | Terraform CD"

# =============================================================================
# JOB 4: Terraform Destroy (manual only — requires explicit dispatch)
# =============================================================================
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'
    environment: dev-destroy   # Thêm required reviewers bắt buộc cho job này
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: terraform-cd-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false \
            -no-color

      - name: Terraform destroy
        run: |
          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_gitops_repo_url: ${{ secrets.GITOPS_REPO_URL }}

      - name: Notify Slack — Destroy
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ job.status == 'success' && 'warning' || 'danger' }}
          SLACK_TITLE: "⚠️ Terraform DESTROY — DEV"
          SLACK_MESSAGE: |
            Actor  : ${{ github.actor }}
            Status : ${{ job.status }}
            Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
