name: Terraform CD

# =============================================================================
# CD Pipeline: plan -> OPA gate -> apply (or destroy)
# Uses OIDC instead of static AWS keys — no secret rotation needed.
#
# Execution Flow:
#   plan | apply  -->  plan --> opa-gate --> apply --> notify-apply
#   destroy       -->  destroy --> notify-destroy
#
# Trigger:
#   - workflow_dispatch only (manual plan / apply / destroy)
#   - Push-to-main auto trigger is currently DISABLED (commented out below).
#     Uncomment the `push:` block to re-enable auto plan + apply on main.
#
# Required GitHub Secrets:
#   AWS_DEV_ROLE_ARN     — IAM Role ARN for OIDC (dev account)
#   BUCKET_TF_STATE      — S3 bucket name for remote state
#   GITOPS_REPO_URL
#   SLACK_WEBHOOK_URL
#
# Required GitHub Environments (Settings -> Environments):
#   dev-plan     — exists; create if missing
#   dev-apply    — MUST be created manually with required reviewers before
#                  first use, or the apply job will queue waiting on it
#   dev-destroy  — MUST be created manually with required reviewers before
#                  first use, or the destroy job will queue waiting on it
# =============================================================================

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "platform/infrastructure/terraform/environments/dev/**"
  #     - "platform/infrastructure/terraform/modules/**"
  #     - ".github/workflows/terraform-cd.yaml"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

env:
  TF_VERSION: "1.10.0"
  TF_WORKING_DIR: "platform/infrastructure/terraform/environments/dev"
  AWS_REGION: "ap-southeast-1"

# Only one CD workflow runs at a time — avoids concurrent applies
concurrency:
  group: terraform-cd-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

# =============================================================================
# JOB 1: Terraform Plan
# =============================================================================
jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: dev-plan   # GitHub Environment, add required reviewers if needed
    permissions:
      contents: read
      id-token: write       # Required for OIDC

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: terraform-cd-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false \
            -no-color

      - name: Terraform plan
        id: plan
        run: |
          # `set +e` is required: GitHub Actions bash steps run with
          # `set -eo pipefail` by default. With pipefail on, `terraform plan`
          # exiting 2 (changes present, via -detailed-exitcode) makes the
          # whole `... | tee ...` pipeline "fail", and errexit then aborts
          # the script BEFORE the `echo exitcode=...` line below ever runs —
          # so the plan_exitcode output silently stays empty/0 even when
          # there genuinely are changes to apply.
          set +e
          terraform plan \
            -out=tfplan \
            -input=false \
            -no-color \
            -detailed-exitcode \
            2>&1 | tee ${{ runner.temp }}/tf-plan.txt
          EXITCODE=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${EXITCODE}" >> $GITHUB_OUTPUT
          echo "Terraform plan exit code: ${EXITCODE}"
        env:
          TF_VAR_gitops_repo_url: ${{ secrets.GITOPS_REPO_URL }}
        continue-on-error: true

      - name: Export plan to JSON (for OPA)
        if: steps.plan.outputs.exitcode != '1'
        run: |
          terraform show -json tfplan > ${{ runner.temp }}/tf-plan.json
          # Validate JSON
          jq -e . ${{ runner.temp }}/tf-plan.json > /dev/null
          echo "Plan JSON exported successfully."

      - name: Stage artifacts in one flat directory

        run: |
          mkdir -p ${{ runner.temp }}/plan-artifacts
          cp tfplan ${{ runner.temp }}/plan-artifacts/tfplan
          cp ${{ runner.temp }}/tf-plan.json ${{ runner.temp }}/plan-artifacts/tf-plan.json
          cp ${{ runner.temp }}/tf-plan.txt ${{ runner.temp }}/plan-artifacts/tf-plan.txt

      - name: Upload plan artifacts
        if: steps.plan.outputs.exitcode != '1'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          # tfplan (binary) is required so the apply job can apply the exact
          # plan that OPA already reviewed, instead of re-planning blind.
          path: ${{ runner.temp }}/plan-artifacts
          retention-days: 3

      - name: Fail if plan errored (exitcode=1)
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "Terraform plan failed (exit code 1). Check logs above."
          exit 1

# =============================================================================
# JOB 2: OPA Gate — blocks apply if there are deny violations
# =============================================================================
  opa-gate:
    name: OPA Policy Gate
    runs-on: ubuntu-latest
    needs: plan
    # Only runs when the plan actually has changes (exitcode=2). exitcode=0
    # means there is nothing to apply, so the policy check would be wasted.
    if: needs.plan.outputs.plan_exitcode == '2'

    steps:
      - name: Checkout code (needed for policies/)
        uses: actions/checkout@v4

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan

      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version

      - name: Run OPA — security.rego deny
        id: security_deny
        run: |
          RESULT=$(opa eval \
            --format json \
            --data platform/infrastructure/terraform/policies/security.rego \
            --input ${{ runner.temp }}/plan/tf-plan.json \
            "data.terraform.security.deny")
          COUNT=$(echo "$RESULT" | jq '.result[0].expressions[0].value | length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "--- Security DENY violations ---"
          echo "$RESULT" | jq -r '.result[0].expressions[0].value[]' | sed 's/^/  /'

      - name: Run OPA — networking.rego deny
        id: networking_deny
        run: |
          RESULT=$(opa eval \
            --format json \
            --data platform/infrastructure/terraform/policies/networking.rego \
            --input ${{ runner.temp }}/plan/tf-plan.json \
            "data.terraform.networking.deny")
          COUNT=$(echo "$RESULT" | jq '.result[0].expressions[0].value | length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "--- Networking DENY violations ---"
          echo "$RESULT" | jq -r '.result[0].expressions[0].value[]' | sed 's/^/  /'

      - name: Run OPA — compliance.rego deny
        id: compliance_deny
        run: |
          RESULT=$(opa eval \
            --format json \
            --data platform/infrastructure/terraform/policies/compliance.rego \
            --input ${{ runner.temp }}/plan/tf-plan.json \
            "data.terraform.compliance.deny")
          COUNT=$(echo "$RESULT" | jq '.result[0].expressions[0].value | length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "--- Compliance DENY violations ---"
          echo "$RESULT" | jq -r '.result[0].expressions[0].value[]' | sed 's/^/  /'

      - name: Run OPA — warnings (non-blocking)
        run: |
          echo "=== WARNINGS (non-blocking) ==="
          for policy in security networking compliance; do
            opa eval \
              --format json \
              --data platform/infrastructure/terraform/policies/${policy}.rego \
              --input ${{ runner.temp }}/plan/tf-plan.json \
              "data.terraform.${policy}.warn" 2>/dev/null \
            | jq -r '.result[0].expressions[0].value[]' \
            | sed "s/^/  [WARN][$policy] /" || true
          done

      - name: Fail if any DENY violations
        run: |
          SEC="${{ steps.security_deny.outputs.count }}"
          NET="${{ steps.networking_deny.outputs.count }}"
          CMP="${{ steps.compliance_deny.outputs.count }}"
          TOTAL=$(( ${SEC:-0} + ${NET:-0} + ${CMP:-0} ))
          echo "OPA deny violations — security: $SEC, networking: $NET, compliance: $CMP, total: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            echo "[FAIL] OPA gate failed: $TOTAL deny violation(s) found. Fix before applying."
            exit 1
          fi
          echo "[OK] OPA gate passed: no deny violations."

# =============================================================================
# JOB 3: Terraform Apply
# =============================================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [plan, opa-gate]
    # Apply only runs when:
    #   - Auto: push to main with real plan changes (exitcode=2)
    #   - Manual: workflow_dispatch with action=apply AND the plan actually
    #     produced changes (exitcode=2) — apply now reuses the saved tfplan
    #     artifact, so there must be a plan artifact to download.
    # opa-gate is allowed to be 'success' here only (not 'skipped'), because
    # apply can only run when plan_exitcode == '2', which always means
    # opa-gate ran for real.
    if: |
      needs.opa-gate.result == 'success' &&
      needs.plan.outputs.plan_exitcode == '2' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
      )
    environment: dev-apply   # GitHub Environment — add required reviewers here for prod
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      apply_status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: terraform-cd-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false \
            -no-color

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        # Apply the exact plan file produced by the plan job and reviewed by
        # OPA — never re-plan here, or the apply could diverge from what was
        # actually gated. No -auto-approve needed: passing a saved plan file
        # already skips the interactive confirmation.
        run: |
          terraform apply \
            -input=false \
            -no-color \
            tfplan
        env:
          TF_VAR_gitops_repo_url: ${{ secrets.GITOPS_REPO_URL }}

      - name: Collect outputs
        if: success()
        run: |
          terraform output -json > ${{ runner.temp }}/tf-outputs.json
          echo "=== Terraform Outputs ==="
          cat ${{ runner.temp }}/tf-outputs.json | jq 'to_entries[] | "\(.key): \(.value.value)"' -r

# =============================================================================
# JOB 4: Notify — Apply Result (separate job per execution flow)
# =============================================================================
  notify-apply:
    name: Notify — Apply Result
    runs-on: ubuntu-latest
    needs: apply
    if: always() && needs.apply.result != 'skipped'

    steps:
      - name: Notify Slack — Apply Result
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ needs.apply.result == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Terraform Apply — DEV ${{ needs.apply.result == 'success' && '[PASS]' || '[FAIL]' }}"
          SLACK_MESSAGE: |
            Actor  : ${{ github.actor }}
            Commit : ${{ github.sha }}
            Status : ${{ needs.apply.result }}
            Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_FOOTER: "EKS DevSecOps Platform | Terraform CD"

# =============================================================================
# JOB 5: Terraform Destroy (manual only — requires explicit dispatch)
# =============================================================================
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'
    environment: dev-destroy   # Required reviewers should be mandatory on this job
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    outputs:
      destroy_status: ${{ job.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: terraform-cd-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -input=false \
            -no-color

      - name: Terraform destroy
        run: |
          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color
        env:
          TF_VAR_gitops_repo_url: ${{ secrets.GITOPS_REPO_URL }}

# =============================================================================
# JOB 6: Notify — Destroy Result (separate job per execution flow)
# =============================================================================
  notify-destroy:
    name: Notify — Destroy Result
    runs-on: ubuntu-latest
    needs: destroy
    if: always() && needs.destroy.result != 'skipped'

    steps:
      - name: Notify Slack — Destroy
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: ${{ needs.destroy.result == 'success' && 'warning' || 'danger' }}
          SLACK_TITLE: "Terraform DESTROY — DEV"
          SLACK_MESSAGE: |
            Actor  : ${{ github.actor }}
            Status : ${{ needs.destroy.result }}
            Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_FOOTER: "EKS DevSecOps Platform | Terraform CD"
