name: Application CD

# =============================================================================
# Application CD — Build -> Trivy Image Scan -> Push ECR -> Update Kustomize -> Commit
# Trigger: merge to main on changes under microservices-application/
#
# Flow:
#   detect-changes -> build-and-scan (per service, matrix) -> update-gitops (partial)
#
# DESIGN NOTE — Partial update:
# Each service in the matrix reports its own build status via a status
# artifact. GitOps is updated only for services with status=success; any
# blocked/failed/skipped service is left untouched and reported in Slack.
# This way one bad service doesn't block deployment of the others.
#
# GitHub Secrets:
#   AWS_DEV_ROLE_ARN     — OIDC role for ECR push
#   AWS_ACCOUNT_ID       — used to build ECR URI
#   SLACK_WEBHOOK_URL
#   GITOPS_BOT_TOKEN     — GitHub PAT for git commit into GitOps repo
# =============================================================================

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "microservices-application/**"
  #     - ".github/workflows/app-cd.yaml"

  workflow_dispatch:
    inputs:
      service:
        description: "Service to build (leave empty for auto-detect)"
        required: false
        default: ""
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev

env:
  AWS_REGION: "ap-southeast-1"
  ECR_REGISTRY: "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com"
  PROJECT_NAME: "eks-devsecops"
  KUSTOMIZE_OVERLAY_PATH: "platform/gitops/kustomize/overlays/dev/applications/online-boutique"

# Sequential execution — prevent concurrent ECR pushes and GitOps commits
concurrency:
  group: app-cd-${{ github.ref }}
  cancel-in-progress: false

# =============================================================================
# JOB 1: Detect changed services
# =============================================================================
jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      short_sha: ${{ steps.detect.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: detect
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # Manual override from workflow_dispatch
          if [ -n "${{ github.event.inputs.service }}" ]; then
            SERVICES='["${{ github.event.inputs.service }}"]'
            echo "services=$SERVICES" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Manual override: building ${{ github.event.inputs.service }}"
            exit 0
          fi

          # 3-dot diff against the merge base, so it's correct whether HEAD
          # is a regular commit or a merge commit with multiple parents.
          CHANGED=$(git diff --name-only HEAD^1...HEAD -- microservices-application/ 2>/dev/null || \
                    git diff --name-only HEAD -- microservices-application/)

          echo "Changed files:"
          echo "$CHANGED"

          # Extract service names from path: microservices-application/<service>/...
          SERVICES=$(echo "$CHANGED" | \
            grep "^microservices-application/" | \
            cut -d'/' -f2 | \
            sort -u | \
            grep -v "^$" | \
            jq -R . | jq -sc .)

          echo "Detected services: $SERVICES"

          if [ "$SERVICES" = "[]" ] || [ -z "$SERVICES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "services=$SERVICES" >> $GITHUB_OUTPUT
          fi

# =============================================================================
# JOB 2: Build -> Trivy Image Scan -> Push ECR (matrix per service)
# =============================================================================
  build-and-scan:
    name: Build & Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
      security-events: write

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false  # Continue building other services if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          role-session-name: app-cd-${{ matrix.service }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          SERVICE="${{ matrix.service }}"
          SHORT_SHA="${{ needs.detect-changes.outputs.short_sha }}"
          TIMESTAMP=$(date -u '+%Y%m%d%H%M%S')
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-dev-${SERVICE}"

          echo "service=$SERVICE"                          >> $GITHUB_OUTPUT
          echo "image_uri=$IMAGE_URI"                     >> $GITHUB_OUTPUT
          echo "image_tag=$SHORT_SHA"                     >> $GITHUB_OUTPUT
          echo "full_image=${IMAGE_URI}:${SHORT_SHA}"     >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP"                     >> $GITHUB_OUTPUT

      - name: Build Docker image
        id: build
        run: |
          SERVICE_DIR="microservices-application/${{ matrix.service }}"

          # Services without a Dockerfile are intentionally skipped (e.g.
          # config-only changes). All downstream steps check
          # steps.build.outputs.skipped before touching the image.
          if [ ! -f "$SERVICE_DIR/Dockerfile" ]; then
            echo "[SKIP] No Dockerfile found at $SERVICE_DIR/Dockerfile"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          docker build \
            --tag "${{ steps.meta.outputs.full_image }}" \
            --tag "${{ steps.meta.outputs.image_uri }}:latest" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            --label "build.timestamp=${{ steps.meta.outputs.timestamp }}" \
            --file "$SERVICE_DIR/Dockerfile" \
            "$SERVICE_DIR"

          echo "skipped=false" >> $GITHUB_OUTPUT
          echo "[OK] Image built: ${{ steps.meta.outputs.full_image }}"

      # Single JSON scan is the source of truth; SARIF and the human-readable
      # table below are both derived from it instead of re-scanning the image.
      - name: Trivy image scan (JSON)
        id: trivy_json
        if: steps.build.outputs.skipped != 'true'
        # Pinned to an immutable commit SHA (v0.36.0), not a mutable tag.
        # aquasecurity/trivy-action tags were compromised in a March 2026
        # supply-chain attack (75/76 version tags force-pushed to malicious
        # commits). Tags without a leading "v" (e.g. 0.28.0) were retired
        # and no longer resolve. Do not revert to a bare version tag.
        uses: aquasecurity/trivy-action@ed142fdcb1de6fa9f3ba1550f1d92abfa9c81e51 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.full_image }}
          format: "json"
          output: "trivy-image-${{ matrix.service }}.json"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Convert Trivy JSON -> SARIF (for GitHub Security tab)
        if: steps.build.outputs.skipped != 'true'
        run: |
          trivy convert \
            --format sarif \
            --output "trivy-image-${{ matrix.service }}.sarif" \
            "trivy-image-${{ matrix.service }}.json"

      - name: Print human-readable table (from JSON, log only)
        if: steps.build.outputs.skipped != 'true'
        run: |
          REPORT="trivy-image-${{ matrix.service }}.json"
          echo "=== Trivy results for ${{ matrix.service }} (CRITICAL/HIGH) ==="
          jq -r '
            .Results[]? | select(.Vulnerabilities) |
            .Target as $t |
            .Vulnerabilities[] |
            "\($t) | \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) -> \(.FixedVersion // "n/a")"
          ' "$REPORT" || echo "No vulnerabilities found."

      - name: Block push if CRITICAL vulnerabilities found
        id: gate
        if: steps.build.outputs.skipped != 'true'
        run: |
          REPORT="trivy-image-${{ matrix.service }}.json"
          if [ -f "$REPORT" ]; then
            CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$REPORT" 2>/dev/null || echo 0)
            echo "CRITICAL vulnerabilities found: $CRITICAL"
            if [ "$CRITICAL" -gt 0 ]; then
              echo "[FAIL] Blocking push: $CRITICAL CRITICAL CVE(s) detected in ${{ matrix.service }}. Fix before pushing to ECR."
              jq -r '.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL") | "\(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.Title)"' "$REPORT" | head -20
              exit 1
            fi
            echo "[OK] No CRITICAL CVEs — safe to push."
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.build.outputs.skipped != 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.service }}.sarif
          category: Trivy-Image-${{ matrix.service }}

      - name: Push image to ECR
        if: steps.build.outputs.skipped != 'true'
        run: |
          docker push "${{ steps.meta.outputs.full_image }}"
          docker push "${{ steps.meta.outputs.image_uri }}:latest"
          echo "[OK] Pushed: ${{ steps.meta.outputs.full_image }}"
          echo "[OK] Pushed: ${{ steps.meta.outputs.image_uri }}:latest"

      - name: Upload Trivy reports
        if: always() && steps.build.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.service }}
          path: |
            trivy-image-${{ matrix.service }}.sarif
            trivy-image-${{ matrix.service }}.json
          retention-days: 14

      # Status artifact drives the partial GitOps update in the next job —
      # only services recorded as "success" here get their image tag bumped.
      - name: Record build status (for partial GitOps update)
        if: always()
        run: |
          mkdir -p status
          if [ "${{ steps.build.outputs.skipped }}" = "true" ]; then
            STATUS="skipped_no_dockerfile"
          elif [ "${{ steps.gate.outcome }}" = "failure" ]; then
            STATUS="blocked_critical_cve"
          elif [ "${{ job.status }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi

          cat > "status/status-${{ matrix.service }}.json" <<EOF
          {
            "service": "${{ matrix.service }}",
            "status": "${STATUS}",
            "image_tag": "${{ needs.detect-changes.outputs.short_sha }}"
          }
          EOF
          cat "status/status-${{ matrix.service }}.json"

      - name: Upload build status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.service }}
          path: status/status-${{ matrix.service }}.json
          retention-days: 1

# =============================================================================
# JOB 3: Update Kustomize image tags + commit to GitOps repo (partial update)
# =============================================================================
  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-scan]
    # Runs unless the upstream job was cancelled — a single failing/blocked
    # service must not prevent GitOps updates for the services that succeeded.
    # Which services actually get updated is decided per-service below, based
    # on each service's status artifact.
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.build-and-scan.result != 'cancelled'
    permissions:
      contents: write  # Required to commit into the repo

    steps:
      - name: Checkout code (GitOps manifests)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_BOT_TOKEN }}
          fetch-depth: 1

      - name: Download all per-service status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: status-*
          path: status
          merge-multiple: true

      - name: Determine which services to update
        id: filter
        run: |
          echo "=== Raw status files ==="
          ls -la status/ || true
          cat status/*.json 2>/dev/null || true

          UPDATE_SERVICES=$(jq -s -c '[.[] | select(.status == "success") | .service]' status/*.json 2>/dev/null || echo "[]")
          SKIPPED_SERVICES=$(jq -s -c '[.[] | select(.status != "success") | {service: .service, status: .status}]' status/*.json 2>/dev/null || echo "[]")

          echo "Services to update in GitOps : $UPDATE_SERVICES"
          echo "Services NOT updated         : $SKIPPED_SERVICES"

          echo "update_services=$UPDATE_SERVICES" >> $GITHUB_OUTPUT
          echo "skipped_services=$SKIPPED_SERVICES" >> $GITHUB_OUTPUT

      - name: Install Kustomize
        if: steps.filter.outputs.update_services != '[]'
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Update image tags in Kustomize overlay
        if: steps.filter.outputs.update_services != '[]'
        run: |
          SHORT_SHA="${{ needs.detect-changes.outputs.short_sha }}"
          SERVICES='${{ steps.filter.outputs.update_services }}'
          OVERLAY="${{ env.KUSTOMIZE_OVERLAY_PATH }}"

          cd "$OVERLAY"
          echo "Updating image tags to $SHORT_SHA in $OVERLAY"

          echo "$SERVICES" | jq -r '.[]' | while read -r service; do
            IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ env.PROJECT_NAME }}-dev-${service}"
            echo "  Updating $service -> ${IMAGE_URI}:${SHORT_SHA}"
            # || true: keeps the loop going for the remaining services even if
            # one service isn't declared as an image in kustomization.yaml.
            # Check the logs above if a service appears to silently no-op.
            kustomize edit set image "${service}=${IMAGE_URI}:${SHORT_SHA}" || true
          done

          echo "=== Updated kustomization.yaml ==="
          cat kustomization.yaml

      - name: Commit and push changes
        if: steps.filter.outputs.update_services != '[]'
        run: |
          SHORT_SHA="${{ needs.detect-changes.outputs.short_sha }}"
          UPDATED="${{ steps.filter.outputs.update_services }}"
          NOT_UPDATED="${{ steps.filter.outputs.skipped_services }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ${{ env.KUSTOMIZE_OVERLAY_PATH }}/kustomization.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit — images already up to date."
          else
            COMMIT_MSG="chore(gitops): update image tags to ${SHORT_SHA}

          Services updated     : ${UPDATED}
          Services NOT updated : ${NOT_UPDATED}
          GitHub Actions Run: ${{ github.run_id }}
          Triggered by: ${{ github.actor }}
          Commit: ${{ github.sha }}"

            git commit -m "$COMMIT_MSG"
            git push origin main

            echo "[OK] GitOps manifest updated and pushed."
            echo "ArgoCD will detect this change and sync automatically."
          fi

      - name: Notify Slack — CD Result
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Reflects whether the rollout was fully or only partially applied,
          # not just this job's own pass/fail.
          SLACK_COLOR: ${{ steps.filter.outputs.skipped_services == '[]' && 'good' || 'warning' }}
          SLACK_TITLE: >-
            App CD - DEV ${{ steps.filter.outputs.skipped_services == '[]' && '[PASS]' || '[PARTIAL]' }}
          SLACK_MESSAGE: |
            Detected      : ${{ needs.detect-changes.outputs.services }}
            Updated       : ${{ steps.filter.outputs.update_services }}
            Not updated   : ${{ steps.filter.outputs.skipped_services }}
            Image Tag     : ${{ needs.detect-changes.outputs.short_sha }}
            Actor         : ${{ github.actor }}
            ArgoCD        : Syncing automatically (for updated services only)
            Run           : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_FOOTER: "EKS DevSecOps Platform | App CD"
