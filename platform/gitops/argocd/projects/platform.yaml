apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: >-
    Cloud-Native DevSecOps Platform on AWS EKS managed through
    ArgoCD GitOps, including platform services, security controls,
    observability stack, and microservices workloads.

  sourceRepos:
    - https://github.com/dinhtri6905/aws-eks-devsecops-platform.git

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: security
      server: https://kubernetes.default.svc
    - namespace: gatekeeper-system
      server: https://kubernetes.default.svc
    - namespace: falco   
      server: https://kubernetes.default.svc
    - namespace: online-boutique
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true

  roles:
    - name: admin
      description: Full access to manage applications in this project
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - platform-admins

    - name: readonly
      description: Read-only access to applications in this project
      policies:
        - p, proj:platform:readonly, applications, get, platform/*, allow
      groups:
        - platform-viewers
