apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    platform-layer: security
  annotations:
    # Deploy after platform-services (wave 1) — Gatekeeper webhooks must not block LBC install
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: platform
  source:
    repoURL: https://github.com/dinhtri6905/aws-eks-devsecops-platform.git
    targetRevision: main
    path: platform/gitops/kustomize/security
    # Deploys OPA Gatekeeper (with ConstraintTemplates/Constraints) and Falco (runtime threat detection) 
    # components: trong ArgoCD Kustomize source dùng để reference Kustomize Component (một loại resource đặc biệt với kind: Component). Nhưng opa-gatekeeper và falco trong project là các folder thông thường với kind: Kustomization — không phải Component.
    # kustomize:
    #   components:
    #     - opa-gatekeeper
    #     - falco
        
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Ignore Gatekeeper webhook caBundle — injected at runtime, not managed by Git
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/1/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle