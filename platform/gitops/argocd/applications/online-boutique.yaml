apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    platform-layer: applications
  annotations:
    # Deploy last (wave 5) — platform + security + observability must be ready first
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform-project
  # Deploys the Online Boutique microservices application.
  # The dev overlay applies cost-saving patches (reduced
  # replicas, dev-specific config) on top of the base
  # application manifests.
  source:
    repoURL: https://github.com/dinhtri6905/aws-eks-devsecops-platform.git
    targetRevision: main
    # Đảm bảo đường dẫn này trỏ đúng vào thư mục kustomization.yaml của ứng dụng
    path: platform/gitops/kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true 
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m