# ============================================================
# Helm values for kube-prometheus-stack
# Chart: https://prometheus-community.github.io/helm-charts
# Deploys: Prometheus, Grafana, Alertmanager, Node Exporter,
#          kube-state-metrics in a single Helm release.
#
# ArgoCD Application path:
#   platform/gitops/kustomize/observability/kube-prometheus-stack
# ============================================================

fullnameOverride: prometheus

# ============================================================
# PROMETHEUS
# ============================================================
# http://prometheus-operated:9090
prometheus:
  prometheusSpec:
    # Keep 7 days of metrics locally — enough for dev debugging
    retention: 7d
    retentionSize: "8GB"

    # Discover ServiceMonitors and PodMonitors from all namespaces,
    # not just the ones that match the Helm release labels.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Persistent storage on gp2 — required for data to survive pod restarts
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

  # Expose Prometheus UI for port-forwarding in dev
  service:
    type: ClusterIP
    port: 9090

# ============================================================
# GRAFANA
# ============================================================
grafana:
  enabled: true

  # Change in prod using an External Secret
  adminPassword: "admin"

  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi
    accessModes: ["ReadWriteOnce"]

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

  # Auto-provision dashboards from ConfigMaps in the monitoring namespace
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      folder: /var/lib/grafana/dashboards/platform
    datasources:
      enabled: true

  # Grafana datasources — Prometheus is wired automatically by the chart
  additionalDataSources: []

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    analytics:
      check_for_updates: false
    log:
      mode: console
    log.console:
      level: info

  service:
    type: ClusterIP
    port: 80

# ============================================================
# ALERTMANAGER
# ============================================================
alertmanager:
  enabled: true

  alertmanagerSpec:
    retention: 120h

    # Allow Alertmanager to discover AlertmanagerConfig CRDs defined
    # outside this Helm release (e.g. platform/gitops/.../alertmanager/).
    # Without this selector, standalone AlertmanagerConfig objects are
    # silently ignored by the Operator.
    alertmanagerConfigSelector:
      matchLabels:
        release: kube-prometheus-stack
    # Empty selector = look in all namespaces, not just "monitoring".
    alertmanagerConfigNamespaceSelector: {}
    # "None" applies AlertmanagerConfig routes as-is, without the Operator
    # auto-injecting a namespace matcher onto each route.
    alertmanagerConfigMatcherStrategy:
      type: None

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["namespace", "alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
    receivers:
      - name: "null"
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["namespace", "alertname"]

  service:
    type: ClusterIP
    port: 9093

# ============================================================
# NODE EXPORTER
# Collects node-level metrics: CPU, memory, disk, network
# ============================================================
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 30Mi
    limits:
      cpu: 100m
      memory: 50Mi

# ============================================================
# KUBE STATE METRICS
# Exposes Kubernetes object state as Prometheus metrics
# ============================================================
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ============================================================
# DEFAULT RULES
# Built-in alert rules from the chart — keep most enabled
# ============================================================
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false        # etcd is managed by EKS, not accessible
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerResource: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false  # not exposed on EKS
    kubelet: true
    kubeProxy: false              # not exposed on EKS
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false  # not exposed on EKS
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# EKS does not expose these endpoints
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# ============================================================
# PROMETHEUS OPERATOR
# Disable admission webhooks to prevent PreSync hook blocking
# ============================================================
prometheus-operator:
  admissionWebhooks:
    enabled: false
