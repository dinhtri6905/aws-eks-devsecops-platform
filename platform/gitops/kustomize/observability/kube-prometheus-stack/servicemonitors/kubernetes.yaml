# ============================================================
# ServiceMonitors — Core Kubernetes Components
# Tells Prometheus to scrape kube-apiserver, kubelet,
# coredns, and kube-state-metrics.
# Note: EKS hides etcd, controller-manager, scheduler —
#       those targets are not included.
# ============================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubelet-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: aws-eks-devsecops-platform
    platform-layer: observability
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: kubelet
  endpoints:
    - port: https-metrics
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 30s
      honorLabels: true
    - port: https-metrics
      scheme: https
      path: /metrics/cadvisor
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 30s
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coredns-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: aws-eks-devsecops-platform
    platform-layer: observability
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: kube-dns
  endpoints:
    - port: metrics
      interval: 30s
      honorLabels: true
