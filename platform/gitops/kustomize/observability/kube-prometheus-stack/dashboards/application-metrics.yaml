# ============================================================
# Grafana Dashboard — Application Metrics (Online Boutique)
# Shows: running pods, restarts, per-service CPU and Memory,
#        restart trend over time.
# Namespace filter: online-boutique
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-application-metrics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: aws-eks-devsecops-platform
    platform-layer: observability
data:
  application-metrics.json: |
    {
      "title": "Application Metrics \u2014 Online Boutique",
      "uid": "application-metrics",
      "schemaVersion": 38,
      "tags": [
        "online-boutique",
        "application"
      ],
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Running Pods \u2014 online-boutique",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"online-boutique\",phase=\"Running\"})",
              "legendFormat": "Running Pods"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Container Restarts (1h) \u2014 online-boutique",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"online-boutique\"}[1h]))",
              "legendFormat": "Restarts"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "thresholds": {
              "steps": [
                {
                  "color": "green",
                  "value": 0
                },
                {
                  "color": "yellow",
                  "value": 3
                },
                {
                  "color": "red",
                  "value": 10
                }
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "CPU Usage by Service",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"online-boutique\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Memory Usage by Service (MiB)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"online-boutique\",container!=\"\",container!=\"POD\"}) / 1024 / 1024",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pod Restarts over Time",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"online-boutique\"}[5m]) > 0",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        }
      ]
    }
