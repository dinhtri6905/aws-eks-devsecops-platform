# ============================================================
# adservice-netpol
#
# Ingress:
#   - frontend   → adservice:9555
#   - Prometheus → :9555/metrics
#
# Egress:
#   - → CoreDNS:53
#   (leaf service — không gọi service nào khác)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adservice-netpol
  namespace: online-boutique
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app: adservice
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Chỉ frontend gọi adservice
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 9555
          protocol: TCP

    # Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9555
          protocol: TCP

  egress:
    # CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
