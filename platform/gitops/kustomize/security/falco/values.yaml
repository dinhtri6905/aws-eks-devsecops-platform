# ============================================================
# Helm values for Falco
# Chart: https://falcosecurity.github.io/charts
# Version: 4.7.4
#
# Custom rules are no longer inline here.
# They are defined in custom-rules/custom-rules.yaml as a
# ConfigMap, then mounted into Falco via extraVolumes so they
# can be updated independently without a Helm upgrade.
# ============================================================

# Modern eBPF driver — no kernel module required on EKS
driver:
  kind: ebpf

tty: false

falcoctl:
  artifact:
    install:
      enabled: true
    follow:
      enabled: true

falco:
  rules_file:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d
    # Custom rules mounted from ConfigMap
    - /etc/falco/custom-rules/custom-rules.yaml

  json_output: true
  json_include_output_property: true
  log_level: info

  webserver:
    enabled: true
    listen_port: 8765

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

# Falco needs privileged access to read kernel events via eBPF.
# The 'falco' namespace is excluded in each OPA Constraint's
# excludedNamespaces list — this is an intentional exception.
securityContext:
  privileged: true

tolerations:
  - effect: NoSchedule
    operator: Exists

# Mount the custom-rules ConfigMap into the Falco DaemonSet
# so rules can be updated by changing the ConfigMap only,
# without triggering a full Helm chart upgrade.
extraVolumes:
  - name: custom-rules
    configMap:
      name: falco-custom-rules

extraVolumeMounts:
  - name: custom-rules
    mountPath: /etc/falco/custom-rules
    readOnly: true
