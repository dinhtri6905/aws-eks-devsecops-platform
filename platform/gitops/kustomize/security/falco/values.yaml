# ============================================================
# Helm values for Falco
# Chart: https://falcosecurity.github.io/charts
# Version: 9.1.0
#
# Custom rules are defined in custom-rules/custom-rules.yaml
# as a ConfigMap, mounted into Falco via extraVolumes so they
# can be updated independently without a Helm upgrade.
# ============================================================

# modern_ebpf driver — CO-RE eBPF, no kernel module or probe loader needed.
# Supported on EKS (kernel >= 5.8, Amazon Linux 2023 / Bottlerocket).
driver:
  kind: modern_ebpf

tty: false

falcoctl:
  artifact:
    install:
      enabled: true
    follow:
      enabled: true

falco:
  rules_file:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/rules.d
    - /etc/falco/custom-rules/custom-rules.yaml

  json_output: true
  json_include_output_property: true
  log_level: info

  webserver:
    enabled: true
    listen_port: 8765

  # In chart v9, container resources live under falco key
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

# Falco needs privileged access to read kernel events via eBPF.
# The 'falco' namespace is excluded in each OPA Constraint's
# excludedNamespaces list — this is an intentional exception.
containerSecurityContext:
  privileged: true

tolerations:
  - effect: NoSchedule
    operator: Exists

# Mount the custom-rules ConfigMap into the Falco DaemonSet
extraVolumes:
  - name: custom-rules
    configMap:
      name: falco-custom-rules

extraVolumeMounts:
  - name: custom-rules
    mountPath: /etc/falco/custom-rules
    readOnly: true
