# ============================================================
# Falco — Runtime Threat Detection
# Deploys Falco as a DaemonSet on every worker node via Helm.
# Custom detection rules are loaded from a separate ConfigMap
# (custom-rules/custom-rules.yaml) and mounted into Falco at
# /etc/falco/custom-rules/custom-rules.yaml.
#
# Upgrade path:
#   - Helm config change  → edit values.yaml
#   - Rule change only    → edit custom-rules/custom-rules.yaml
#     (Falco hot-reloads via inotify, no pod restart needed)
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: falco

helmCharts:
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: 9.1.0
    releaseName: falco
    namespace: falco
    valuesFile: values.yaml

resources:
  - custom-rules/custom-rules.yaml