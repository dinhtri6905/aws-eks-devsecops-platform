# ============================================================
# Helm values for gatekeeper (OPA Gatekeeper)
# Chart: https://open-policy-agent.github.io/gatekeeper/charts
# ============================================================

replicas: 1
audit:
  replicas: 1
  # Re-evaluate existing resources against constraints
  # periodically so drift is detected even without admission
  # events.
  auditInterval: 60
  constraintViolationsLimit: 100
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Gatekeeper's own namespace is excluded from admission so it
# can manage itself; the namespace also carries the
# admission.gatekeeper.sh/ignore: "true" label set in
# kustomize/base/namespace.yaml.
namespace: gatekeeper-system

# Exempt system namespaces from policy enforcement.
disableValidatingWebhook: false
validatingWebhookTimeoutSeconds: 5
mutatingWebhookTimeoutSeconds: 2

# Apply ConstraintTemplates and Constraints via Gatekeeper's
# native CRDs (templates/ and constraints/ directories), not
# via Helm values — values.yaml only configures the
# Gatekeeper controllers themselves.

resources:
  controllerManager:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  audit:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

controllerManager:
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Excluded namespaces — these never get evaluated against any
# constraint (kept in sync with the `excludedNamespaces` lists
# inside each Constraint manifest).
podAnnotations: {}

emitAdmissionEvents: true
emitAuditEvents: true

logLevel: INFO