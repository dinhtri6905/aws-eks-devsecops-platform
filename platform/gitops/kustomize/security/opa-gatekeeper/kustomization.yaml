# ============================================================
# opa-gatekeeper
# Policy-as-Code admission control for the EKS cluster.
#
# Sync order matters: Gatekeeper's CRDs (ConstraintTemplates)
# must exist before the Constraint CRs that reference them.
# ArgoCD's `kustomize` build renders everything as one list,
# but Gatekeeper's own validating webhook only starts
# rejecting/validating Constraints once the matching
# ConstraintTemplate CRD is established — apply order is
# handled via sync waves on the parent Application
# (security.yaml) if stricter ordering is needed.
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gatekeeper-system

# ArgoCD syncs this as part of the security Application (sync-wave: "2").
# Resources within are ordered by their own sync-wave annotations:
#   wave 0 — Gatekeeper Helm chart (via HelmChartInflationGenerator or pre-rendered)
#   wave 1 — ConstraintTemplates  (register custom CRDs)
#   wave 2 — Constraints          (apply policies against registered CRDs)

resources:
  - https://raw.githubusercontent.com/open-policy-agent/gatekeeper/v3.17.1/deploy/gatekeeper.yaml
  
  # ConstraintTemplates (CRDs)
  - templates/k8sdisallowprivileged.yaml
  - templates/k8snonroot.yaml
  - templates/k8srequiredresources.yaml
  - templates/k8sdisallowedtags.yaml
  - templates/k8sreadonlyrootfs.yaml
  - templates/k8sallowedrepos.yaml
  - templates/k8srequiredlabels.yaml

  # Constraints (instances of the templates above)
  - constraints/disallow-privileged.yaml
  - constraints/require-non-root.yaml
  - constraints/require-resource-limits.yaml
  - constraints/disallow-latest-tag.yaml
  - constraints/require-read-only-root-filesystem.yaml
  - constraints/allow-ecr-and-trusted-registries-only.yaml
  - constraints/require-labels.yaml

