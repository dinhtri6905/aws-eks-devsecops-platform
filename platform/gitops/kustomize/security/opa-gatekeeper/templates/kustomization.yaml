apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ConstraintTemplates must be applied BEFORE Constraints.
# Each file below carries: argocd.argoproj.io/sync-wave: "1"
# Gatekeeper registers a new CRD for each ConstraintTemplate —
# ArgoCD waits for the CRD to become established before moving to wave 2.

resources:
  - k8sallowedrepos.yaml
  - k8sdisallowedtags.yaml
  - k8sdisallowprivileged.yaml
  - k8snonroot.yaml
  - k8sreadonlyrootfs.yaml
  - k8srequiredlabels.yaml
  - k8srequiredresources.yaml