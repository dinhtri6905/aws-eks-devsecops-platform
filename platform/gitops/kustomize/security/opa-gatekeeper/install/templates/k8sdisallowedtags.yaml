apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowedtags
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    description: >-
      Disallows container images using mutable/ambiguous tags
      such as ':latest' or images with no tag at all, to
      ensure GitOps deployments are deterministic and
      reproducible.
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowedTags
      validation:
        openAPIV3Schema:
          type: object
          properties:
            tags:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowedtags

        violation[{"msg": msg}] {
          c := input_containers[_]
          img := c.image
          tag := image_tag(img)
          disallowed := input.parameters.tags[_]
          tag == disallowed
          msg := sprintf("Container '%v' uses disallowed image tag '%v' (image: %v)", [c.name, tag, img])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not contains(c.image, ":")
          msg := sprintf("Container '%v' must specify an explicit image tag (image: %v)", [c.name, c.image])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }

        image_tag(img) = tag {
          parts := split(img, ":")
          count(parts) > 1
          tag := parts[count(parts) - 1]
        }
