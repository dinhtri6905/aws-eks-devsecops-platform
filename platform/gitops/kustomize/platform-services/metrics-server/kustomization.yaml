# ============================================================
# metrics-server
# Provides CPU/Memory metrics for `kubectl top` and the
# Horizontal Pod Autoscaler (used by overlays/prod/hpa.yaml).
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

helmCharts:
  - name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.12.2
    releaseName: metrics-server
    namespace: kube-system
    valuesInline:
      replicas: 1
      args:
        - --kubelet-preferred-address-types=InternalIP
        - --kubelet-insecure-tls
        - --metric-resolution=15s
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
