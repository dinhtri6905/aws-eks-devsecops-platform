# ============================================================
# aws-load-balancer-controller
# Watches Ingress/Service resources and provisions AWS ALBs/NLBs.
# Requires the IRSA role created by the Terraform `eks` module
# (alb_controller_role_arn).
#
# IngressClass "alb" is created by the Helm chart itself, not by
# a hand-written resource — avoids a duplicate-resource conflict
# between a manual ingressclass.yaml and the chart's own output.
# ============================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

# CRDs required by the controller (TargetGroupBinding, IngressClassParams, ...).
# Kustomize's helmCharts inflator does NOT install CRDs bundled under a
# chart's crds/ folder the way `helm install` does, so they must be applied
# as plain resources here — otherwise the controller pod crash-loops with:
#   "no matches for kind \"TargetGroupBinding\" in version \"elbv2.k8s.aws/v1beta1\""
resources:
  - crds.yaml

helmCharts:
  - name: aws-load-balancer-controller
    repo: https://aws.github.io/eks-charts
    version: 1.8.1
    releaseName: aws-load-balancer-controller
    namespace: kube-system
    # Real clusterName/region/vpcId/image/resources/securityContext come
    # from values.rendered.yaml, regenerated by scripts/Render-LbcValues.ps1
    # from live Terraform outputs. Do NOT hardcode vpcId/clusterName/region
    # here via valuesInline again — a stale hardcoded vpcId here previously
    # caused the controller to point at a non-existent VPC and crash.
    valuesFile: values.rendered.yaml