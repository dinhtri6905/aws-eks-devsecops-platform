# ============================================================
# Helm values for aws-load-balancer-controller
# Generated by platform/gitops/scripts/Render-LbcValues.ps1
# ============================================================

clusterName: __CLUSTER_NAME__

region: __AWS_REGION__
vpcId: "__VPC_ID__"

replicaCount: 1

image:
  repository: public.ecr.aws/eks/aws-load-balancer-controller
  tag: v2.9.0

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::041659741748:role/eks-devsecops-dev-aws-lbc-role"

enableCertManager: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: false
  minAvailable: 1

createIngressClassResource: true
ingressClassParams:
  create: false
ingressClassConfig:
  default: true

serviceMonitor:
  enabled: false
