# ============================================================
# IngressClass: alb
# Referenced by Online Boutique's frontend Ingress
# (spec.ingressClassName: alb) so that the AWS Load Balancer
# Controller provisions an Application Load Balancer for it.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: ingress.k8s.aws/alb
