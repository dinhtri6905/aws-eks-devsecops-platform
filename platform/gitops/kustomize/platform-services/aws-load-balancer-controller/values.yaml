# ============================================================
# Helm values for aws-load-balancer-controller
# Chart: https://github.com/aws/eks-charts (aws-load-balancer-controller)
#
# IRSA role ARN comes from the Terraform `eks` module output
# `alb_controller_role_arn` (see
# platform/infrastructure/terraform/modules/eks/outputs.tf).
# Replace <ALB_CONTROLLER_ROLE_ARN> with that output, or wire
# it via the overlays/dev|prod configmap/patch pipeline.
# ============================================================

clusterName: eks-devsecops-dev-cluster

region: ap-southeast-1
vpcId: "" # filled by overlay patch from terraform output `vpc_id`, or set explicitly
# Terraform chịu trách nhiệm tạo VPC/EKS và export các thông tin hạ tầng như vpc_id, region, cluster_name thông qua output.
# Không hardcode vpcId trong GitOps base (values.yaml để trống).
# Sau khi Terraform hoàn tất, CI/CD pipeline sẽ lấy output từ Terraform và inject vào environment overlay (overlays/dev|prod).
# ArgoCD chỉ theo dõi GitOps repository và deploy cấu hình đã được cập nhật.
# Giữ đúng nguyên tắc GitOps: Git là source of truth, Terraform chỉ quản lý infrastructure, ArgoCD quản lý Kubernetes workload.

replicaCount: 1

image:
  repository: public.ecr.aws/eks/aws-load-balancer-controller
  tag: v2.9.0

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::041659741748:role/eks-devsecops-dev-alb-controller-role"

# Disable the controller's own webhook cert auto-generation
# only if cert-manager is used instead. Default (true) is fine
# for a standalone deploy.
enableCertManager: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# IngressClass is created separately via ingressclass.yaml so
# it can be referenced explicitly by Online Boutique's Ingress
# (`spec.ingressClassName: alb`).
createIngressClassResource: false

serviceMonitor:
  enabled: false
