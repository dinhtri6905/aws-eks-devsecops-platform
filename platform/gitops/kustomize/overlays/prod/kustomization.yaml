apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: online-boutique

bases:
  - ../../applications/online-boutique

commonLabels:
  environment: prod

patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
  - path: resource-limits-patch.yaml
    target:
      kind: Deployment

# HPA for high-traffic services
resources:
  - hpa.yaml

configMapGenerator:
  - name: online-boutique-env
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=warn
      - ENABLE_PROFILER=0
