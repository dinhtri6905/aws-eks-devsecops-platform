apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: online-boutique

# Point to the base — all 13 services
bases:
  - ../../applications/online-boutique

# Dev-specific label on every resource
commonLabels:
  environment: dev

# Patches applied in dev
patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: ".*"
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: online-boutique-env

# Inject env config as a ConfigMap
configMapGenerator:
  - name: online-boutique-env
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=info
      - ENABLE_PROFILER=0
