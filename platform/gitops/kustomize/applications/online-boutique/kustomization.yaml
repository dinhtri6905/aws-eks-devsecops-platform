apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: online-boutique

commonLabels:
  project: eks-devsecops
  managed-by: argocd

resources:
  - adservice
  - cartservice
  - checkoutservice
  - currencyservice
  - emailservice
  - frontend
  - loadgenerator
  - paymentservice
  - productcatalogservice
  - recommendationservice
  - redis-cart
  - shippingservice
  # - shoppingassistantservice
  - analysis-template.yaml

# commonLabels doesn't patch spec.selector.matchLabels on the
# Rollout CRD (Kustomize doesn't know its schema), so it drifts
# out of sync with the Service selectors. Add it manually here.
patches:
  - target:
      kind: Rollout
      group: argoproj.io
      version: v1alpha1
    patch: |-
      - op: add
        path: /spec/selector/matchLabels/project
        value: eks-devsecops
      - op: add
        path: /spec/selector/matchLabels/managed-by
        value: argocd